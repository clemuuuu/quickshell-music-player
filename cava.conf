# cava du lecteur musique : sortie brute lue par shell.qml
[general]
framerate = 30
autosens = 1
bars = 36

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 55
