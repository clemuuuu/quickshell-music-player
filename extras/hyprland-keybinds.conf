# Raccourcis Hyprland pour le lecteur (à copier dans ta config Hyprland)
$musicPlayer = ~/.config/quickshell/music-player/extras/music-player.sh

bind = SUPER ALT, M, exec, $musicPlayer                      # ouvrir / fermer (ou remettre en fenêtre)
bind = SUPER SHIFT ALT, left, exec, $musicPlayer dock left   # coller à gauche (2e fois = fenêtre)
bind = SUPER SHIFT ALT, right, exec, $musicPlayer dock right
bind = SUPER SHIFT ALT, up, exec, $musicPlayer dock top
bind = SUPER SHIFT ALT, down, exec, $musicPlayer dock bottom
